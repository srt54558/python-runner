<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#ffffff" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="K+ Coder" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<script>
			try {
				var theme = localStorage.getItem('theme');
				var dark =
					theme === 'dark' ||
					theme === 'coffee' ||
					(!theme && matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) document.documentElement.classList.add('dark');
				if (theme === 'coffee') document.documentElement.classList.add('theme-coffee');
				if (theme === 'pink') document.documentElement.classList.add('theme-pink');
				var themeColors = {
					light: '#ffffff',
					dark: '#0a0a0a',
					coffee: '#2a1c11',
					pink: '#fff0f7'
				};
				var themeColor = themeColors.light;
				if (theme === 'coffee') themeColor = themeColors.coffee;
				else if (theme === 'pink') themeColor = themeColors.pink;
				else if (dark) themeColor = themeColors.dark;
				var themeMeta = document.querySelector('meta[name="theme-color"]');
				if (themeMeta) themeMeta.setAttribute('content', themeColor);
			} catch (error) {
				/* Theme is applied again after the app starts. */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
